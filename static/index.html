<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Swap Studio</title>
  <style>
    :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
    .card { background: var(--card); border-radius: 12px; padding: 1.5rem; text-align: center; border: 1px solid #334155; }
    input[type="file"] { display: none; }
    .upload-btn { display: inline-block; padding: 0.75rem 1.5rem; background: #334155; color: #fff; border-radius: 8px; cursor: pointer; margin-top: 1rem; }
    .preview { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; background: #0f172a; margin-top: 1rem; }
    .btn-submit { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 2rem; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    #result-section { margin-top: 2rem; display: none; text-align: center; }
    #result-image { max-width: 100%; border-radius: 12px; margin-top: 1rem; }
    .download-btn { display: inline-block; padding: 0.75rem 1.5rem; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Face Identity Swap Studio</h1>
    <div class="grid">
      <div class="card">
        <h3>Source (Identity / Face)</h3>
        <img id="source-preview" class="preview" alt="Source Preview">
        <label class="upload-btn">Choose Source Photo
          <input type="file" id="source-input" accept="image/*" onchange="previewImage(this, 'source-preview')">
        </label>
      </div>
      <div class="card">
        <h3>Target (Pose / Outfit)</h3>
        <img id="target-preview" class="preview" alt="Target Preview">
        <label class="upload-btn">Choose Target Photo
          <input type="file" id="target-input" accept="image/*" onchange="previewImage(this, 'target-preview')">
        </label>
      </div>
    </div>

    <button id="swap-btn" class="btn-submit" onclick="submitSwap()">Generate Swapped Image</button>

    <div id="result-section" class="card">
      <h3>Swapped Result</h3>
      <img id="result-image" src="" alt="Swapped Result">
      <br>
      <a id="download-link" href="#" download="swapped_result.jpg" class="download-btn">Download Result</a>
    </div>
  </div>

  <script>
    function previewImage(input, previewId) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => document.getElementById(previewId).src = e.target.result;
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function submitSwap() {
      const sourceFile = document.getElementById('source-input').files[0];
      const targetFile = document.getElementById('target-input').files[0];

      if (!sourceFile || !targetFile) {
        alert("Please select both source and target images.");
        return;
      }

      const btn = document.getElementById('swap-btn');
      btn.disabled = true;
      btn.innerText = "Processing Swap...";

      const formData = new FormData();
      formData.append('source', sourceFile);
      formData.append('target', targetFile);

      try {
        const res = await fetch('/api/swap', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          document.getElementById('result-image').src = data.result_url + '?t=' + new Date().getTime();
          document.getElementById('download-link').href = data.result_url;
          document.getElementById('result-section').style.display = 'block';
        } else {
          alert("Error: " + data.error);
        }
      } catch (err) {
        alert("Server communication error.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Generate Swapped Image";
      }
    }
  </script>
</body>
</html>
